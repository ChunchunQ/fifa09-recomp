# Lobby leave crash (19 Oct, 5-player Be A Pro): sub_82882AF8 removes a player index from
# two 32-slot object tables (mgr+2408, +2536) and reads slot->+256. A slot can hold a bogus
# value (seen 0x101 -> read of 0x201) when several peers drop at once. Guard: before
# "cmplwi cr6,r7,0", a non-pointer r7 becomes 0 so the slot is skipped.
[[midasm_hook]]
address = 0x82882b40
name = "Tp_PeerSlotGuard"
registers = ["r7"]

# Team play routing (19 Oct, 5-7 player Be A Pro stuck in the loading arena): CommUDP sends
# every packet to the address ConnApi gave it, which is the server's own address ("my
# partner"), so the relay copied the host's stream for client A to ALL clients and every
# client's acks to everyone; with 3+ players the reliable streams got foreign seq/acks.
# sub_82874148 (CommUDP raw send: r31 = ref, r7 = destination, DirtySock sockaddr) right
# before SocketSendto: once the ref is bound to a peer (ref+0x8c, a 10.x virtual address),
# send to that peer, so the relay forwards it to that one player only.
[[midasm_hook]]
address = 0x8287419c
name = "Tp_CommUdpSendToPeer"
registers = ["r31", "r7"]

# ...but CommUDP already sends to the peer's 10.x address (ref+0x8c); the server address comes
# from DirtySock ProtoTunnel: its send callback (sub_82881690, 'sdcb') maps the 10.x address to
# a tunnel (virtual address at tunnel+36) and the flush sub_828812E8 sends the batch to the
# tunnel's remote address (tunnel+4 / +8 = the server). Before that SocketSendto (0x82881568:
# r31 = tunnel, r7 = sockaddr on the stack) the address becomes the tunnel's 10.x address.
[[midasm_hook]]
address = 0x82881568
name = "Tp_TunnelSendToPeer"
registers = ["r31", "r7"]

# Diagnostics (team play routing): every guest sendto, destination + callers.
[[midasm_hook]]
address = 0x82fb5e40
name = "Tp_SendtoTrace"
registers = ["r3", "r5", "r7", "r1"]

# Team play routing, the real spot (19 Oct, 1.2.4 diagnostics): CommUDP sends to the peer's
# 10.x address, but DirtySock's SocketSendto converts it in sub_8287E060: a 32-entry address
# map at global+648 (108 bytes each) gives a "real" address at entry+96, which is the server's
# own address for every player, so the relay could not tell the receivers apart and copied
# every packet to all players (3+ players stuck in the loading arena). At "mr r27,r11"
# (r27 = address being sent to, r11 = mapped address) a 10.x address is kept as it is, so
# the relay forwards each packet to exactly that player. NOBK_TP_DIRECT=0 turns it off.
[[midasm_hook]]
address = 0x8287e110
name = "Tp_KeepVirtualAddr"
registers = ["r27", "r11"]

# ...the 1.2.5 hook above never fired: the address map is empty. The conversion comes from
# the ROUTE table right after it (32 entries of 20 bytes, net/mask/gateway/ports): a route
# for the 10.x players sends every packet to the gateway = the server. A matched route lands
# on loc_8287E16C; for a 10.x destination we jump to the end (0x8287E1E4, no rewrite), so the
# packet keeps the player's address and the relay forwards it to that player only.
[[midasm_hook]]
address = 0x8287e16c
name = "Tp_SkipRouteForPlayers"
registers = ["r27", "r28", "r29"]
jump_address_on_true = 0x8287e1e4

# Font heap full (Be A Pro crash after a goal, 20 Oct): FontFusion alloc returned NULL and
# sub_82425CD0 wrote its header to NULL+4. Give the block from the system heap instead.
[[midasm_hook]]
address = 0x82425d50
name = "Font_AllocFallback"
registers = ["r1", "r31"]

# ...and its free: our blocks go back to the system heap, skipping the game's free.
[[midasm_hook]]
address = 0x82425cac
name = "Font_FreeFallback"
registers = ["r31"]
jump_address_on_true = 0x82425cb8
