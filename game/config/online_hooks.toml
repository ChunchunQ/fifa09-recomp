name = "SesDbg_UdpPacket"
registers = ["r31", "r3", "r1"]

# Reassembly drain: confirms a reliable datagram was accepted. The r3+0x3c
# push callback is optional and zero in this title's usual pull-receive path.
[[midasm_hook]]
address = 0x82874448
name = "SesDbg_CommUdpProcess"
registers = ["r3", "r4"]

# CommUDP virtual pull-receive method (vtable +0x34). This must run after a
# reassembled OSDK packet for the game to pass it to its OSDK dispatcher.
[[midasm_hook]]
address = 0x82875cc8
name = "SesDbg_CommUdpRecv"
registers = ["r3", "r4", "r5", "r6"]

# Same pull-receive method after its return byte count has been loaded into r3.
# This identifies the real post-receive game caller and payload.
[[midasm_hook]]
address = 0x82875d44
name = "SesDbg_CommUdpRecvResult"
registers = ["r3", "r30", "r1"]

# Completed CommUDP internal stream record, immediately before the owning
# CommUDP object's vtable callback. 0x82876878 is the bctrl itself; 0x8287687c
# is already after it, where volatile r11 no longer reliably holds the callback.
[[midasm_hook]]
address = 0x82876878
name = "SesDbg_CommUdpMessageReady"
registers = ["r3", "r11", "r29", "r1"]

# Every completed stream record, after lbz r11,6(r29) but before the tag
# comparison. It remains active when tag is 0 (normal timer/keepalive frame),
# unlike the callback probe above which runs only for tag 2.
[[midasm_hook]]
address = 0x82876860
name = "SesDbg_CommUdpRecord"
registers = ["r31", "r29", "r11", "r1"]

# Stream worker entry after `lwz r31,76(r3)`. It exposes the stream's real
# app callback fields even when the post-buffer notify guard does not pass.
[[midasm_hook]]
address = 0x82876b30
name = "SesDbg_CommUdpStreamWorker"
registers = ["r3", "r31", "r1"]

# Normal stream-record delivery: sub_82876B18 calls the owning application's
# receiver after the stream worker buffered tag-1 lobby frames. This is the
# real post-buffer handoff, not CommUDP's tag-2 transport callback above.
[[midasm_hook]]
address = 0x82876b8c
name = "SesDbg_CommUdpStreamNotify"
registers = ["r3", "r11", "r31", "r1"]

# Reassembled CommUDP payload about to enter the ref's application callback.
